<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152c3b">
  <title>مخزون البودرة</title>
  <style>
    :root{--navy:#152c3b;--teal:#168c84;--ink:#263844;--muted:#71828b;--line:#e3e9e9;--bg:#f3f6f5;--white:#fff;--red:#a94442}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .top{background:var(--navy);color:white;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:3}
    .top strong{font-size:17px}.top small{display:block;color:#b9cbd0;font-size:11px;margin-top:3px}
    .top-actions{display:flex;gap:6px;flex-shrink:0}
    .wrap{max-width:1000px;margin:auto;padding:16px 14px 90px}
    .notice{max-width:1000px;margin:12px auto 0;padding:10px 14px;background:#fff8ec;border:1px solid #f2e5cb;border-radius:10px;color:#80633d;font-size:12px;line-height:1.7}
    .title{margin:4px 2px 14px}.title h1{font-size:22px;color:var(--navy);margin:0 0 4px}.title p{font-size:12px;color:var(--muted);margin:0}
    .card{background:white;border:1px solid var(--line);border-radius:13px;padding:15px;margin:11px 0}
    .card h2{font-size:15px;color:var(--navy);margin:0 0 8px}.sub{font-size:12px;color:var(--muted);margin:0 0 12px}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#f4f8f7;border-radius:10px;padding:12px}.stat b{display:block;font-size:22px;color:var(--teal)}.stat span{font-size:11px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{font-size:12px;color:#596c74;display:block;margin-bottom:5px}
    .field input,.field select{width:100%;min-height:40px;border:1px solid #dfe6e5;border-radius:8px;background:#fff;padding:7px 9px;color:var(--ink)}
    .full{grid-column:1/-1}.btn{border:0;border-radius:8px;background:#eaf1ef;color:#42565c;padding:9px 12px;font-size:12px}
    .btn.primary{background:var(--teal);color:white;font-weight:600}.btn.danger{background:#fbebeb;color:var(--red)}.btn.small{padding:7px 9px;font-size:11px}
    .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.top .btn{font-size:11px;padding:8px}
    .row-card{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;background:white}
    .row-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.row-title{font-size:13px;font-weight:700}
    .meta{font-size:11px;color:var(--muted);line-height:1.7;margin-top:4px}.pill{white-space:nowrap;border-radius:12px;padding:4px 7px;background:#eef2f2;color:#62757b;font-size:10px}
    .pill.factory{background:#e6f5ef;color:#25866c}.pill.opened{background:#fff3e3;color:#a56b26}
    .row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.weight-edit{display:flex;gap:6px;align-items:center;margin-top:9px;font-size:11px}
    .weight-edit input{width:88px;min-height:34px;border:1px solid var(--line);border-radius:7px;padding:5px}
    .table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:var(--muted);font-weight:600}
    .empty{color:var(--muted);font-size:12px;padding:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:6px 3px calc(6px + env(safe-area-inset-bottom));z-index:4;backdrop-filter:blur(8px)}
    .nav{border:0;background:transparent;color:#71828b;font-size:10px;padding:5px 2px}.nav span{display:block;font-size:18px;margin-bottom:2px}.nav.active{color:var(--teal);font-weight:700}
    .category-tabs{display:flex;gap:5px;padding:4px;background:#f1f5f4;border-radius:13px}.category-tabs .btn{flex:1;border-radius:10px;background:transparent;color:var(--muted);padding:11px 8px}.category-tabs .btn.active{background:white;color:var(--teal);box-shadow:0 2px 8px #152c3b12;font-weight:700}
    .powder-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin:15px 0 12px}
    .chip{position:relative;display:flex;min-width:0;min-height:94px;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px 6px;border:1px solid #e5ecea;border-radius:15px;background:linear-gradient(160deg,#fff,#f8fbfa);color:var(--ink);box-shadow:0 2px 7px #152c3b0b;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease}
    .chip:hover{transform:translateY(-2px);border-color:#a9d8d1;box-shadow:0 5px 12px #152c3b12}
    .chip:focus-visible{outline:3px solid #168c8440;outline-offset:2px}
    .chip.active{border-color:var(--teal);background:linear-gradient(155deg,#f1fbf8,#e5f5f1);box-shadow:0 0 0 2px #168c8418,0 5px 12px #168c8414}
    .chip-code{font-size:15px;font-weight:750;letter-spacing:.04em;font-variant-numeric:tabular-nums;direction:ltr}
    .chip-meta{font-size:10px;color:var(--muted);line-height:1.2}
    .chip.active .chip-meta{color:#287b72}
    .add-chip{border-style:dashed;background:#fbfdfc;color:var(--teal);box-shadow:none}
    .chip-add-icon{font-size:23px;font-weight:400;line-height:1}
    .add-chip .chip-meta{color:var(--teal);font-weight:600}
    details{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}summary{cursor:pointer;color:var(--teal);font-size:12px;font-weight:600}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.detail-grid div{min-width:0}.detail-grid small{display:block;color:var(--muted);font-size:10px}.detail-grid span{font-size:12px;overflow-wrap:anywhere}
    .toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#183747;color:white;padding:10px 14px;border-radius:9px;font-size:12px;z-index:5;max-width:90vw}
    @media(min-width:700px){.top{padding-left:max(16px,calc((100vw - 1000px)/2));padding-right:max(16px,calc((100vw - 1000px)/2))}.wrap{padding-top:24px}.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.full{grid-column:auto}.full.wide{grid-column:1/-1}.bottom{position:sticky;top:56px;display:flex;justify-content:center;border-top:0;border-bottom:1px solid var(--line);padding:5px;background:white}.nav{width:145px;font-size:12px}.nav span{display:none}}
  </style>
</head>
<body>
  <header class="top">
    <div><strong>مخزون البودرة</strong><small>نسخة متصفح مستقلة</small></div>
    <div class="top-actions">
      <button class="btn" onclick="exportBackup()">تصدير نسخة</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">استيراد</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden onchange="importBackup(this.files[0])">
    </div>
  </header>
  <aside class="notice">تنبيه: البيانات محفوظة في هذا المتصفح فقط، ولا تتزامن مع نسخة الكمبيوتر أو الأجهزة الأخرى. صدّر نسخة احتياطية بانتظام؛ مسح بيانات المتصفح قد يحذف المخزون. لا توجد هنا حسابات دخول أو قراءة OCR.</aside>
  <nav class="bottom">
    <button class="nav active" data-page="home" onclick="openPage('home')"><span>▤</span>الرئيسية</button>
    <button class="nav" data-page="add" onclick="openPage('add')"><span>＋</span>إضافة</button>
    <button class="nav" data-page="track" onclick="openPage('track')"><span>◷</span>الكرتون</button>
    <button class="nav" data-page="stock" onclick="openPage('stock')"><span>▥</span>الأرصدة</button>
    <button class="nav" data-page="powder" onclick="openPage('powder')"><span>▦</span>قائمة البودرة</button>
    <button class="nav" data-page="moves" onclick="openPage('moves')"><span>↻</span>الحركات</button>
  </nav>
  <main class="wrap" id="page"></main>
  <div id="toast" class="toast" hidden></div>
  <script>
    const STORAGE_KEY='powder-inventory-pages-v1';
    const COLORS=['1001','1013','1015','1019','2004','3001','3010','3015','4000','5010','5007','5015','5016','6005','7001','7003','7015','7035','8001','8002','8003','8004','8006','8007','8014','8015','8016','8017','9010','9016'];
    const TEXTURES=['غامق محبب','غامق 7','فاتح 8','أبيض 3028','أحمر 308'];
    const emptyState=()=>({cartons:[],movements:[],colors:[...COLORS],textures:[...TEXTURES]});
    function loadState(){
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw)return emptyState();
      const saved=JSON.parse(raw);
      if(!saved||!Array.isArray(saved.cartons)||!Array.isArray(saved.movements))throw new Error('صيغة البيانات المحفوظة غير معروفة. لا تمسح بيانات الموقع قبل استعادة نسخة احتياطية.');
      return {cartons:saved.cartons,movements:saved.movements,colors:Array.isArray(saved.colors)?saved.colors:[...COLORS],textures:Array.isArray(saved.textures)?saved.textures:[...TEXTURES],mappings:saved.mappings||{}};
    }
    let state;
    try{state=loadState()}catch(error){document.getElementById('page').innerHTML='<section class="card"><h2>تعذر فتح بيانات هذا المتصفح</h2><p class="sub">'+escapeHtml(error.message)+'</p></section>';throw error}
    let activePage='home',showConsumed=false,toastTimer,powderCategory='ألوان',powderItem='',editingCartonId=null;
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function persist(){
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
      catch(error){alert('تعذر حفظ البيانات في المتصفح: '+error.message+' صدّر نسخة احتياطية واحذف بيانات قديمة من المتصفح.');throw error}
    }
    function showToast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2800)}
    function timestamp(){return new Date().toLocaleString('sv-SE')}
    function record(carton,action,weight){state.movements.unshift({id:Date.now()+Math.random(),carton_id:carton.id,at:timestamp(),action,weight,user:'مستخدم هذا الجهاز',color:carton.color,category:carton.category})}
    function activeCartons(){return state.cartons.filter(item=>!item.deleted)}
    function openPage(page){
      activePage=page;document.querySelectorAll('.nav').forEach(button=>button.classList.toggle('active',button.dataset.page===page));
      ({home:renderHome,add:renderAdd,track:renderTrack,stock:renderStock,powder:renderPowder,moves:renderMoves}[page]||renderHome)();
      window.scrollTo(0,0);
    }
    function title(heading,description=''){return `<div class="title"><h1>${heading}</h1><p>${description}</p></div>`}
    function renderHome(){
      const cartons=activeCartons(),available=cartons.filter(item=>!item.consumed);
      const categories=new Set(available.map(item=>item.category+'|'+item.color)).size;
      document.getElementById('page').innerHTML=title('لوحة المعلومات','ملخص بيانات هذا المتصفح.')+
        `<div class="stats"><div class="stat"><b>${cartons.length}</b><span>إجمالي الكراتين</span></div><div class="stat"><b>${cartons.filter(item=>item.factory&&!item.consumed).length}</b><span>داخل المصنع</span></div><div class="stat"><b>${cartons.filter(item=>item.consumed).length}</b><span>تم استهلاكها</span></div><div class="stat"><b>${categories}</b><span>فئات بها رصيد</span></div></div>`+
        `<section class="card"><h2>آخر الحركات</h2>${movementTable(state.movements.slice(0,8))}</section>`+
        `<section class="card"><h2>نسخة احتياطية</h2><p class="sub">احتفظ بنسخة JSON خارج المتصفح لاستعادة بياناتك إذا تغير الجهاز أو حُذفت بيانات التصفح.</p><div class="actions"><button class="btn primary" onclick="exportBackup()">تصدير البيانات</button><button class="btn" onclick="document.getElementById('importFile').click()">استعادة نسخة</button></div></section>`;
    }
    function renderAdd(){
      const colors=state.colors.map(value=>`<option>${escapeHtml(value)}</option>`).join('');
      const textures=state.textures.map(value=>`<option>${escapeHtml(value)}</option>`).join('');
      document.getElementById('page').innerHTML=title('إضافة كراتين','أدخل البيانات؛ يُسجل كل صندوق كوحدة مستقلة.')+
        `<section class="card"><h2>بيانات الرصيد</h2><div class="grid">
        <div class="field"><label>الشركة</label><select id="company"><option>AkzoNobel</option><option>Union</option><option>Jetton</option></select></div>
        <div class="field"><label>الفئة</label><select id="category" onchange="updateColorOptions()"><option>ألوان</option><option>خشامنيوم</option></select></div>
        <div class="field"><label>اللون / النوع</label><select id="color">${colors}</select></div>
        <div class="field"><label>كود المنتج</label><input id="product"></div>
        <div class="field"><label>كود اللون على الاستيكر</label><input id="sticker" placeholder="مثال KA0718"></div>
        <div class="field"><label>رقم التشغيلة</label><input id="batch"></div>
        <div class="field"><label>تاريخ الإنتاج</label><input id="production" placeholder="مثال 07/2026"></div>
        <div class="field"><label>تاريخ الانتهاء</label><input id="expiry" placeholder="مثال 07/2028"></div>
        <div class="field"><label>الوزن لكل كرتونة (كجم)</label><input id="weight" type="number" min="0.1" step="0.1"></div>
        <div class="field"><label>عدد الكراتين</label><input id="quantity" type="number" min="1" value="1"></div>
        <div class="field"><label>الطرف المرسل</label><select id="sender"><option>M</option><option>H</option><option>A</option></select></div>
        <div class="field full"><label>ملاحظات</label><input id="notes"></div></div>
        <div class="actions"><button class="btn primary" onclick="saveCartons()">حفظ وإضافة</button><button class="btn" onclick="addCustomItem()">إضافة لون/نوع</button></div></section>
        <section class="card"><h2>ربط كود الاستيكر باللون</h2><div class="grid"><div class="field"><label>كود الاستيكر</label><input id="mapCode" placeholder="مثال KA0718"></div><div class="field"><label>اللون</label><select id="mapColor">${colors}</select></div></div><div class="actions"><button class="btn" onclick="saveMapping()">حفظ الربط</button></div></section>`;
      updateColorOptions();
    }
    function updateColorOptions(){
      const category=document.getElementById('category').value,select=document.getElementById('color');
      const values=category==='ألوان'?state.colors:state.textures,previous=select.value;
      select.innerHTML=values.map(value=>`<option>${escapeHtml(value)}</option>`).join('');
      if(values.includes(previous))select.value=previous;
    }
    function addCustomItem(categoryOverride){
      const category=categoryOverride||document.getElementById('category').value;
      const value=prompt(category==='ألوان'?'أدخل رقم اللون الجديد:':'أدخل اسم نوع الخشامنيوم:');
      if(!value||!value.trim())return;
      const list=category==='ألوان'?state.colors:state.textures;
      if(!list.includes(value.trim()))list.push(value.trim());
      persist();if(activePage==='powder')renderPowder();else renderAdd();
    }
    function saveMapping(){
      const code=document.getElementById('mapCode').value.trim().toUpperCase(),color=document.getElementById('mapColor').value;
      if(!code){showToast('اكتب كود الاستيكر أولاً');return}
      state.mappings=state.mappings||{};state.mappings[code]=color;persist();showToast('تم حفظ الربط');
    }
    function saveCartons(){
      const quantity=Number(document.getElementById('quantity').value),weight=Number(document.getElementById('weight').value);
      if(!Number.isInteger(quantity)||quantity<1||quantity>1000||!Number.isFinite(weight)||weight<=0){showToast('أدخل عددًا صحيحًا ووزنًا أكبر من صفر');return}
      const category=document.getElementById('category').value,sticker=document.getElementById('sticker').value.trim().toUpperCase();
      const mapped=(state.mappings||{})[sticker],color=mapped||document.getElementById('color').value;
      for(let index=0;index<quantity;index++){
        const carton={id:Date.now()+index,company:document.getElementById('company').value,category,color,product_code:document.getElementById('product').value.trim(),sticker_code:sticker,batch:document.getElementById('batch').value.trim(),production:document.getElementById('production').value.trim(),expiry:document.getElementById('expiry').value.trim(),initial_weight:weight,remaining_weight:weight,sender:document.getElementById('sender').value,notes:document.getElementById('notes').value.trim(),opened:false,factory:false,consumed:false,deleted:false,created_at:timestamp(),updated_at:timestamp()};
        state.cartons.unshift(carton);record(carton,'إضافة رصيد جديد',`${weight} كجم`);
      }
      persist();showToast(`تم تسجيل ${quantity} كرتونة`);openPage('track');
    }
    function renderTrack(){
      const rows=activeCartons().filter(item=>showConsumed?item.consumed:!item.consumed);
      document.getElementById('page').innerHTML=title('متابعة الكراتين','حدّث حالة الكرتونة ووزنها بعد دخول المصنع.')+
        `<section class="card"><button class="btn" onclick="showConsumed=!showConsumed;renderTrack()">${showConsumed?'عرض الكراتين النشطة':'عرض الكراتين المستهلكة'} (${activeCartons().filter(item=>item.consumed).length})</button>${rows.length?rows.map(cartonCard).join(''):'<div class="empty">لا توجد كراتين في هذه القائمة.</div>'}</section>`;
    }
    function cartonCard(item){
      const status=item.consumed?'مستهلكة':item.factory?'داخل المصنع':item.opened?'مفتوحة':'في المخزن';
      return `<article class="row-card"><div class="row-head"><div><div class="row-title">كرتونة ${item.id} · ${escapeHtml(item.category)} / ${escapeHtml(item.color)}</div><div class="meta">شركة ${escapeHtml(item.company)} · منتج ${escapeHtml(item.product_code||'—')} · تشغيلة ${escapeHtml(item.batch||'—')}<br>إنتاج ${escapeHtml(item.production||'—')} · انتهاء ${escapeHtml(item.expiry||'—')}<br>الوزن ${item.remaining_weight} من ${item.initial_weight} كجم</div></div><span class="pill ${item.factory?'factory':''} ${item.opened?'opened':''}">${status}</span></div>
      <div class="row-actions">${!item.factory&&!item.consumed?`<button class="btn small" onclick="cartonAction(${item.id},'factory')">دخول المصنع</button>`:''}<button class="btn small" onclick="cartonAction(${item.id},'opened')">${item.opened?'إلغاء مفتوحة':'تحديد مفتوحة'}</button><button class="btn small danger" onclick="deleteCarton(${item.id})">حذف من الرصيد</button></div>
      ${item.factory&&!item.consumed?`<div class="weight-edit"><label>الوزن المتبقي</label><input id="weight-${item.id}" type="number" min="0" max="${item.initial_weight}" step="0.1" value="${item.remaining_weight}"><span>كجم</span><button class="btn small primary" onclick="updateWeight(${item.id})">تحديث</button></div>`:''}</article>`;
    }
    function cartonAction(id,action){
      const item=state.cartons.find(row=>row.id===id&&!row.deleted);if(!item)return;
      if(action==='factory'){if(item.factory)return;item.factory=true;record(item,'تم دخولها للمصنع',`${item.remaining_weight} كجم`)}
      else{item.opened=!item.opened;record(item,item.opened?'تم فتح الكرتونة':'إلغاء حالة الفتح',`${item.remaining_weight} كجم`)}
      item.updated_at=timestamp();persist();renderTrack();
    }
    function updateWeight(id){
      const item=state.cartons.find(row=>row.id===id&&!row.deleted);if(!item)return;
      const value=Number(document.getElementById('weight-'+id).value);
      if(!item.factory||!Number.isFinite(value)||value<0||value>item.initial_weight){showToast('الوزن يجب أن يكون بين صفر والوزن الأصلي بعد دخول المصنع');return}
      const previous=item.remaining_weight;item.remaining_weight=value;item.consumed=value===0;item.updated_at=timestamp();
      record(item,item.consumed?'تم استهلاكها بالكامل':'تحديث الوزن بعد الاستهلاك',`${previous} ← ${value} كجم`);
      persist();renderTrack();
    }
    function deleteCarton(id){
      const item=state.cartons.find(row=>row.id===id&&!row.deleted);if(!item||!confirm('ستختفي الكرتونة من الرصيد النشط مع بقاء سجلها. هل تريد المتابعة؟'))return;
      item.deleted=true;item.updated_at=timestamp();record(item,'حذف الكرتونة من الرصيد',`${item.remaining_weight} كجم`);persist();if(activePage==='powder')renderPowder();else renderTrack();
    }
    function renderStock(){
      const groups=new Map();
      activeCartons().filter(item=>!item.consumed).forEach(item=>{const key=item.category+'|'+item.color;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item)});
      const rows=[...groups.entries()];
      const page=document.getElementById('page');
      page.innerHTML=title('الأرصدة الحالية','العدد والوزن حسب الفئة واللون.')+
        `<section class="card">${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>الفئة / اللون</th><th>العدد</th><th>الإنتاج</th><th>الانتهاء</th><th>الوزن</th><th>مفتوحة</th><th>تغيير الحالة</th></tr></thead><tbody>${rows.map(([key,items])=>`<tr><td>${escapeHtml(key.replace('|',' / '))}</td><td>${items.length}</td><td>${escapeHtml(items[0].production||'—')}</td><td>${escapeHtml(items[0].expiry||'—')}</td><td>${items.reduce((sum,item)=>sum+Number(item.remaining_weight),0).toFixed(1)} كجم</td><td>${items.filter(item=>item.opened).length}</td><td><button class="btn small" data-stock-key="${escapeHtml(key)}">${items.every(item=>item.opened)?'إلغاء الفتح':'تحديد مفتوحة'}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد أرصدة مسجلة.</div>'}</section>`;
      page.querySelectorAll('[data-stock-key]').forEach(button=>button.addEventListener('click',()=>toggleStockOpened(button.dataset.stockKey)));
    }
    function toggleStockOpened(key){
      const rows=activeCartons().filter(item=>!item.consumed&&item.category+'|'+item.color===key);
      if(!rows.length)return;
      const opened=!rows.every(item=>item.opened),at=timestamp();
      rows.forEach(item=>{item.opened=opened;item.updated_at=at;record(item,opened?'تغيير حالة الفتح إلى مفتوحة':'إلغاء حالة الفتح',`${item.remaining_weight} كجم`)});
      persist();renderStock();
    }
    function selectPowderCategory(category){
      powderCategory=category;powderItem='';renderPowder();
    }
    function renderPowder(){
      if(editingCartonId){renderCartonEditor();return}
      const items=powderCategory==='ألوان'?state.colors:state.textures;
      if(!items.includes(powderItem))powderItem=powderCategory==='ألوان'&&items.includes('9016')?'9016':items[0]||'';
      const counts=new Map();
      activeCartons().filter(carton=>!carton.consumed&&carton.category===powderCategory).forEach(carton=>counts.set(carton.color,(counts.get(carton.color)||0)+1));
      const page=document.getElementById('page');
      page.innerHTML=title('قائمة البودرة','اختر الفئة والصنف لعرض الرصيد وتفاصيل الكراتين.')+
        `<section class="card"><div class="category-tabs"><button class="btn ${powderCategory==='ألوان'?'active':''}" onclick="selectPowderCategory('ألوان')">ألوان</button><button class="btn ${powderCategory==='خشامنيوم'?'active':''}" onclick="selectPowderCategory('خشامنيوم')">خشامنيوم</button></div><div class="powder-list">${items.map(item=>{const count=counts.get(item)||0;return `<button class="chip ${item===powderItem?'active':''}" data-powder-item="${escapeHtml(item)}" aria-pressed="${item===powderItem}"><span class="chip-code">${escapeHtml(item)}</span><span class="chip-meta">${count?`${count} كرتونة`:'لا يوجد رصيد'}</span></button>`}).join('')}<button class="chip add-chip" id="addPowderItem"><span class="chip-add-icon">＋</span><span class="chip-meta">إضافة لون/نوع</span></button></div></section>`;
      page.querySelectorAll('[data-powder-item]').forEach(button=>button.addEventListener('click',()=>{powderItem=button.dataset.powderItem;renderPowder()}));
      document.getElementById('addPowderItem').addEventListener('click',()=>addCustomItem(powderCategory));
      const rows=activeCartons().filter(item=>!item.consumed&&item.category===powderCategory&&item.color===powderItem);
      const weight=rows.reduce((sum,item)=>sum+Number(item.remaining_weight),0);
      page.insertAdjacentHTML('beforeend',`<section class="card"><h2>${escapeHtml(powderCategory)} / ${escapeHtml(powderItem||'—')}</h2><p class="sub">عدد الكراتين: ${rows.length} · الوزن المتبقي: ${weight.toFixed(1)} كجم</p>${rows.length?rows.map(powderCartonCard).join(''):'<div class="empty">لا يوجد رصيد متاح لهذا الصنف.</div>'}</section>`);
    }
    function powderCartonCard(item){
      const values=[['الشركة',item.company],['الفئة',item.category],['اللون / النوع',item.color],['كود المنتج',item.product_code],['كود الاستيكر',item.sticker_code],['رقم التشغيلة',item.batch],['تاريخ الإنتاج',item.production],['تاريخ الانتهاء',item.expiry],['الوزن الأصلي',`${item.initial_weight} كجم`],['الوزن المتبقي',`${item.remaining_weight} كجم`],['الطرف المرسل',item.sender],['حالة الفتح',item.opened?'مفتوحة':'غير مفتوحة'],['ملاحظات',item.notes],['تاريخ الإضافة',item.created_at],['أضيفت بواسطة',item.created_by],['صورة الاستيكر',item.image_path]];
      const status=item.factory?'داخل المصنع':item.opened?'مفتوحة':'في المخزن';
      return `<article class="row-card"><div class="row-head"><div><div class="row-title">كرتونة ${item.id}</div><div class="meta">تشغيلة ${escapeHtml(item.batch||'—')} · منتج ${escapeHtml(item.product_code||'—')}<br>الإنتاج ${escapeHtml(item.production||'—')} · الانتهاء ${escapeHtml(item.expiry||'—')}<br>${item.remaining_weight} من ${item.initial_weight} كجم</div></div><span class="pill ${item.factory?'factory':''} ${item.opened?'opened':''}">${status}</span></div><details><summary>عرض البيانات الكاملة</summary><div class="detail-grid">${values.map(([label,value])=>`<div><small>${label}</small><span>${escapeHtml(value||'—')}</span></div>`).join('')}</div></details><div class="row-actions"><button class="btn small primary" onclick="editCarton(${item.id})">تعديل البيانات</button><button class="btn small danger" onclick="deleteCarton(${item.id})">حذف من الرصيد</button></div></article>`;
    }
    function editCarton(id){
      const item=state.cartons.find(row=>row.id===id&&!row.deleted);
      if(!item)return;
      editingCartonId=id;renderCartonEditor();
    }
    function renderCartonEditor(){
      const item=state.cartons.find(row=>row.id===editingCartonId&&!row.deleted);
      if(!item){editingCartonId=null;renderPowder();return}
      const colors=state.colors.map(value=>`<option>${escapeHtml(value)}</option>`).join('');
      const textures=state.textures.map(value=>`<option>${escapeHtml(value)}</option>`).join('');
      const field=(id,label,value,type='text')=>`<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${escapeHtml(value??'')}"></div>`;
      document.getElementById('page').innerHTML=title(`تعديل الكرتونة ${item.id}`,'عدّل البيانات ثم احفظ؛ سيُضاف سجل حركة للتعديل.')+
        `<section class="card"><div class="grid"><div class="field"><label>الشركة</label><select id="editCompany"><option>AkzoNobel</option><option>Union</option><option>Jetton</option></select></div><div class="field"><label>الفئة</label><select id="editCategory" onchange="updateEditColorOptions()"><option>ألوان</option><option>خشامنيوم</option></select></div><div class="field"><label>اللون / النوع</label><select id="editColor">${item.category==='ألوان'?colors:textures}</select></div>${field('editProduct','كود المنتج',item.product_code)}${field('editSticker','كود الاستيكر',item.sticker_code)}${field('editBatch','رقم التشغيلة',item.batch)}${field('editProduction','تاريخ الإنتاج',item.production)}${field('editExpiry','تاريخ الانتهاء',item.expiry)}${field('editInitialWeight','الوزن الأصلي (كجم)',item.initial_weight,'number')}${field('editRemainingWeight','الوزن المتبقي (كجم)',item.remaining_weight,'number')}<div class="field"><label>الطرف المرسل</label><select id="editSender"><option>M</option><option>H</option><option>A</option></select></div>${field('editNotes','ملاحظات',item.notes)}</div><div class="actions"><button class="btn primary" onclick="saveCartonEdit()">حفظ التعديلات</button><button class="btn" onclick="editingCartonId=null;renderPowder()">إلغاء</button></div></section>`;
      document.getElementById('editCompany').value=item.company;
      document.getElementById('editCategory').value=item.category;
      document.getElementById('editColor').value=item.color;
      document.getElementById('editSender').value=item.sender||'M';
    }
    function updateEditColorOptions(){
      const category=document.getElementById('editCategory').value,select=document.getElementById('editColor');
      const values=category==='ألوان'?state.colors:state.textures,previous=select.value;
      select.innerHTML=values.map(value=>`<option>${escapeHtml(value)}</option>`).join('');
      select.value=values.includes(previous)?previous:values[0]||'';
    }
    function saveCartonEdit(){
      const item=state.cartons.find(row=>row.id===editingCartonId&&!row.deleted);
      if(!item)return;
      const initial=Number(document.getElementById('editInitialWeight').value),remaining=Number(document.getElementById('editRemainingWeight').value);
      if(!Number.isFinite(initial)||!Number.isFinite(remaining)||initial<=0||remaining<0||remaining>initial){showToast('تحقق من الوزن الأصلي والمتبقي');return}
      const previous=item.remaining_weight;
      Object.assign(item,{company:document.getElementById('editCompany').value,category:document.getElementById('editCategory').value,color:document.getElementById('editColor').value,product_code:document.getElementById('editProduct').value.trim(),sticker_code:document.getElementById('editSticker').value.trim().toUpperCase(),batch:document.getElementById('editBatch').value.trim(),production:document.getElementById('editProduction').value.trim(),expiry:document.getElementById('editExpiry').value.trim(),initial_weight:initial,remaining_weight:remaining,sender:document.getElementById('editSender').value,notes:document.getElementById('editNotes').value.trim(),consumed:remaining===0,updated_at:timestamp()});
      record(item,'تعديل بيانات الكرتونة',`${previous} ← ${remaining} كجم`);
      editingCartonId=null;persist();renderPowder();
    }
    function movementTable(rows){
      if(!rows.length)return '<div class="empty">لا توجد حركات مسجلة.</div>';
      return `<div class="table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>الكرتونة</th><th>الحركة</th><th>اللون</th><th>الوزن</th></tr></thead><tbody>${rows.map(item=>`<tr><td>${escapeHtml(item.at)}</td><td>${item.carton_id}</td><td>${escapeHtml(item.action)}</td><td>${escapeHtml(item.color||'—')}</td><td>${escapeHtml(item.weight||'—')}</td></tr>`).join('')}</tbody></table></div>`;
    }
    function renderMoves(){document.getElementById('page').innerHTML=title('سجل الحركات','تاريخ الإضافة والتحديثات.')+`<section class="card">${movementTable(state.movements)}</section>`}
    function exportBackup(){
      const blob=new Blob([JSON.stringify({format:'powder-inventory-pages-v1',exported_at:timestamp(),data:state},null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='powder-inventory-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('تم تنزيل النسخة الاحتياطية');
    }
    async function importBackup(file){
      if(!file)return;
      try{
        const backup=JSON.parse(await file.text()),data=backup.data;
        if(backup.format!=='powder-inventory-pages-v1'||!data||!Array.isArray(data.cartons)||!Array.isArray(data.movements))throw new Error('الملف ليس نسخة احتياطية معروفة لهذا التطبيق.');
        if(!confirm('سيتم استبدال بيانات هذا المتصفح بمحتوى النسخة الاحتياطية. هل تريد المتابعة؟'))return;
        state={cartons:data.cartons,movements:data.movements,colors:Array.isArray(data.colors)?data.colors:[...COLORS],textures:Array.isArray(data.textures)?data.textures:[...TEXTURES],mappings:data.mappings||{}};
        persist();showToast('تم استيراد النسخة الاحتياطية');openPage(activePage);
      }catch(error){alert('تعذر استيراد النسخة الاحتياطية: '+error.message)}
      finally{document.getElementById('importFile').value=''}
    }
    openPage('home');
  </script>
</body>
</html>
