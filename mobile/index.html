<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152c3b"><link rel="manifest" href="/manifest.webmanifest"><title>مخزون البودرة</title>
<style>
:root{--navy:#152c3b;--teal:#168c84;--ink:#263844;--muted:#71828b;--line:#e3e9e9;--bg:#f3f6f5;--white:#fff;--orange:#e99c45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{background:var(--navy);color:white;padding:14px max(16px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:3}.top strong{font-size:17px}.top small{display:block;color:#b9cbd0;font-size:11px;margin-top:3px}.logout{border:1px solid #ffffff40;background:transparent;color:white;border-radius:8px;padding:8px 11px}.wrap{max-width:1000px;margin:auto;padding:20px 16px 90px}.page-title{margin:3px 2px 16px}.page-title h1{font-size:23px;color:var(--navy);margin:0 0 5px}.page-title p{font-size:13px;color:var(--muted);margin:0}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #132b3708}.card h2{font-size:15px;color:var(--navy);margin:0 0 5px}.sub{font-size:12px;color:var(--muted);margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#f4f8f7;border-radius:11px;padding:13px}.stat b{display:block;font-size:22px;color:var(--teal)}.stat span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field label{font-size:12px;color:#596c74;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;min-height:42px;border:1px solid #dfe6e5;border-radius:8px;background:white;padding:8px 10px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--teal)}.field textarea{min-height:70px}.full{grid-column:1/-1}.btn{border:0;border-radius:9px;background:#eaf1ef;color:#42565c;padding:10px 13px;font-size:13px}.btn.primary{background:var(--teal);color:white;font-weight:600}.btn.small{padding:7px 9px;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.company-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.company{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 4px;color:var(--ink);font-size:12px}.company.active{background:#eaf8f5;border-color:var(--teal);color:var(--teal)}.upload{border:1px dashed #a9c5c1;border-radius:11px;background:#fafdfe;padding:15px;text-align:center}.upload input{width:100%;font-size:12px}.help{font-size:11px;color:var(--muted);line-height:1.7;margin-top:7px}.result{background:#eef8f6;border:1px solid #d9eeea;color:#286e64;border-radius:9px;padding:10px;font-size:12px;line-height:1.7;margin-top:9px}.powder-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;font-size:11px;color:#52636a}.chip.active{background:var(--teal);color:white;border-color:var(--teal)}.row-card{border:1px solid var(--line);border-radius:11px;padding:12px;margin:9px 0;background:#fff}.row-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.row-title{font-size:13px;font-weight:700}.meta{font-size:11px;color:var(--muted);line-height:1.7;margin-top:4px}.pill{white-space:nowrap;border-radius:12px;padding:5px 8px;background:#eef2f2;color:#62757b;font-size:10px}.pill.factory{background:#e6f5ef;color:#25866c}.pill.opened{background:#fff3e3;color:#a56b26}.row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.weight-edit{display:flex;gap:6px;align-items:center;margin-top:9px;font-size:11px}.weight-edit input{width:90px;min-height:34px;border:1px solid var(--line);border-radius:7px;padding:5px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:var(--muted);font-weight:600}.table-wrap{overflow-x:auto}.empty{color:var(--muted);font-size:12px;padding:12px}.section-toggle{border:0;background:none;color:var(--teal);padding:9px 0;font-weight:600}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 3px calc(6px + env(safe-area-inset-bottom));z-index:4;backdrop-filter:blur(8px)}.nav{border:0;background:transparent;color:#71828b;font-size:10px;padding:5px 2px}.nav span{display:block;font-size:18px;margin-bottom:2px}.nav.active{color:var(--teal);font-weight:700}.login{min-height:100dvh;display:grid;place-items:center;padding:18px}.login-box{width:min(430px,100%);background:white;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 5px 25px #152c3b13}.login-box h1{color:var(--navy);font-size:22px;margin:0 0 6px}.login-box p{color:var(--muted);font-size:13px}.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#183747;color:white;padding:11px 15px;border-radius:10px;font-size:12px;z-index:10;box-shadow:0 3px 15px #0002;max-width:90vw}.warn{background:#fff8ec;border:1px solid #f2e5cb;color:#80633d;border-radius:9px;padding:10px;font-size:11px;line-height:1.7;margin-top:12px}
@media(min-width:760px){.wrap{padding-top:28px}.stats{grid-template-columns:repeat(4,1fr)}.bottom{position:sticky;top:58px;bottom:auto;display:flex;justify-content:center;border-top:0;border-bottom:1px solid var(--line);padding:5px;background:#ffffff}.nav{width:145px;font-size:12px}.nav span{display:none}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.full{grid-column:auto}.full.wide{grid-column:1/-1}}
</style></head><body>
<section id="loginView" class="login"><div class="login-box"><h1>مخزون البودرة</h1><p>سجّل الدخول لعرض الأرصدة وتسجيل حركة الكراتين.</p><div class="field"><label>اسم المستخدم</label><input id="loginUser" autocomplete="username"></div><div class="field" style="margin-top:10px"><label>كلمة المرور</label><input id="loginPass" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn primary" style="width:100%" onclick="login()">دخول</button></div><div id="loginError" class="warn hidden"></div></div></section>
<section id="appView" class="hidden"><header class="top"><div><strong>مخزون البودرة</strong><small id="welcome"></small></div><div style="display:flex;gap:6px"><button id="usersLink" class="logout hidden" onclick="openPage('users')">المستخدمون</button><button class="logout" onclick="logout()">خروج</button></div></header><nav class="bottom"><button class="nav active" data-page="home" onclick="openPage('home',this)"><span>▤</span>الرئيسية</button><button class="nav" data-page="add" onclick="openPage('add',this)"><span>＋</span>إضافة</button><button class="nav" data-page="track" onclick="openPage('track',this)"><span>◷</span>الكرتون</button><button class="nav" data-page="stock" onclick="openPage('stock',this)"><span>▥</span>الأرصدة</button><button class="nav" data-page="moves" onclick="openPage('moves',this)"><span>↻</span>الحركات</button></nav><main class="wrap" id="page"></main></section><div id="toast" class="toast hidden"></div>
<script>
let currentUser=null,selectedCompany='AkzoNobel',selectedCategory='ألوان',selectedColor='9016',imagePath='',scanData={};const colors=['1001','1013','1015','1019','2004','3001','3010','3015','4000','5010','5007','5015','5016','6005','7001','7003','7015','7035','8001','8002','8003','8004','8006','8007','8014','8015','8016','8017','9010','9016'];const textures=['غامق محبب','غامق 7','فاتح 8','أبيض 3028','أحمر 308'];
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'تعذر تنفيذ الطلب');return d}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3300)}
async function boot(){try{const d=await api('/api/me');if(d.user){currentUser=d.user;showApp()}}catch{}}
async function login(){const err=document.getElementById('loginError');err.classList.add('hidden');try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:document.getElementById('loginUser').value,password:document.getElementById('loginPass').value})});currentUser=d.user;showApp()}catch(e){err.textContent=e.message;err.classList.remove('hidden')}}
async function logout(){try{await api('/api/logout',{method:'POST',body:'{}'})}catch{}currentUser=null;document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden')}
function showApp(){document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('welcome').textContent='مرحبًا، '+currentUser.username;document.getElementById('usersLink').classList.toggle('hidden',currentUser.role!=='manager');openPage('home',document.querySelector('[data-page=home]'))}
function openPage(page,btn){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));if(btn)btn.classList.add('active');({home:renderHome,add:renderAdd,track:renderTrack,stock:renderStock,moves:renderMoves,users:renderUsers}[page]||renderHome)()}
function title(h,p=''){return `<div class="page-title"><h1>${h}</h1><p>${p}</p></div>`}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
async function renderHome(){const page=document.getElementById('page');page.innerHTML=title('لوحة المعلومات','ملخص سريع لرصيد البودرة وحركة الكراتين.')+'<div class="card"><div class="actions"><button class="btn primary" onclick="openPage(\'add\')">＋ إضافة كراتين</button><button class="btn" onclick="openPage(\'stock\')">عرض الأرصدة</button><button class="btn" onclick="openPage(\'moves\')">سجل الحركات</button></div></div><div id="stats" class="stats"></div><div class="card"><h2>آخر الحركات</h2><div id="recent" class="empty">جارٍ التحميل...</div></div>';
try{const [s,m]=await Promise.all([api('/api/summary'),api('/api/movements')]);document.getElementById('stats').innerHTML=[[s.total,'إجمالي الكراتين'],[s.factory,'داخل المصنع'],[s.consumed,'تم استهلاكها'],[s.categories,'فئات بها رصيد']].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');document.getElementById('recent').innerHTML=m.length?`<div class="table-wrap"><table class="table"><tr><th>التاريخ</th><th>الكرتونة</th><th>الحركة</th><th>اللون</th></tr>${m.slice(0,8).map(x=>`<tr><td>${esc(x.at)}</td><td>${x.carton_id}</td><td>${esc(x.action)}</td><td>${esc(x.color)}</td></tr>`).join('')}</table></div>`:'لا توجد حركات بعد.'}catch(e){toast(e.message)}}
async function renderAdd(){const page=document.getElementById('page');page.innerHTML=title('إضافة كراتين','صوّر الاستيكر أو اختر صورة، ثم راجع البيانات قبل حفظها.')+`<div class="card"><h2>الشركة</h2><p class="sub">اختر الشركة الموجودة على الاستيكر</p><div class="company-row">${['AkzoNobel','Union','Jetton'].map(c=>`<button class="company ${selectedCompany===c?'active':''}" onclick="chooseCompany('${c}',this)">${c}</button>`).join('')}</div></div><div class="card"><h2>صورة الاستيكر</h2><p class="sub">يمكن استخدام الكاميرا أو اختيار صورة موجودة</p><div class="upload"><input id="sticker" type="file" accept="image/*" capture="environment" onchange="scanSticker(this.files[0])"><div class="help">سيتم إرسال الصورة إلى كمبيوتر الشركة ليقرأها Tesseract. راجع القيم المقروءة قبل الحفظ.</div></div><div id="scanStatus" class="help"></div><div id="scanResult" class="result hidden"></div></div><div class="card"><h2>بيانات الكراتين</h2><p class="sub">العدد غير موجود عادة على الاستيكر، أدخله يدويًا.</p><div class="grid"><div class="field"><label>الفئة</label><select id="category" onchange="selectedCategory=this.value;renderColors()"><option>ألوان</option><option>خشامنيوم</option></select></div><div class="field"><label>اللون / نوع الخشامنيوم</label><select id="color"></select></div><div class="field"><label>كود المنتج</label><input id="product"></div><div class="field"><label>كود اللون على الاستيكر</label><input id="code" placeholder="مثال KA0718"></div><div class="field"><label>رقم التشغيلة (Batch)</label><input id="batch"></div><div class="field"><label>تاريخ الإنتاج</label><input id="production" placeholder="مثال 07/2026"></div><div class="field"><label>تاريخ الانتهاء</label><input id="expiry" placeholder="مثال 07/2028"></div><div class="field"><label>الوزن لكل كرتونة (كجم)</label><input id="weight" type="number" step="0.1"></div><div class="field"><label>عدد الكراتين</label><input id="quantity" type="number" min="1" value="1"></div><div class="field"><label>الطرف المرسل</label><select id="sender"><option>M</option><option>H</option><option>A</option></select></div><div class="field full"><label>ملاحظات</label><input id="notes"></div></div><div class="actions"><button class="btn primary" onclick="saveCartons()">حفظ وإضافة الكراتين</button></div></div>`;document.getElementById('category').value=selectedCategory;renderColors();try{const cats=await api('/api/categories');window.extraColors=cats.colors;window.extraTextures=cats.textures;renderColors()}catch{}}
function chooseCompany(v,btn){selectedCompany=v;document.querySelectorAll('.company').forEach(x=>x.classList.toggle('active',x===btn))}
function renderColors(){const sel=document.getElementById('color');if(!sel)return;const vals=selectedCategory==='ألوان'?(window.extraColors||colors):(window.extraTextures||textures);sel.innerHTML=vals.map(v=>`<option>${esc(v)}</option>`).join('');sel.value=vals.includes(selectedColor)?selectedColor:vals[vals.includes('9016')?vals.indexOf('9016'):0]||'';selectedColor=sel.value}
async function scanSticker(file){if(!file)return;const state=document.getElementById('scanStatus');const result=document.getElementById('scanResult');state.textContent='جاري قراءة الاستيكر...';result.classList.add('hidden');const fd=new FormData();fd.append('sticker',file);try{const d=await api('/api/scan',{method:'POST',body:fd});imagePath=d.image_path;scanData=d.fields||{};if(d.text)document.getElementById('scanResult').textContent=d.text;result.classList.toggle('hidden',!d.text);for(const [k,id] of Object.entries({product_code:'product',sticker_code:'code',batch:'batch',production:'production',expiry:'expiry',weight:'weight'})){if(scanData[k]!=null)document.getElementById(id).value=scanData[k]}if(scanData.color){selectedColor=scanData.color;document.getElementById('category').value='ألوان';selectedCategory='ألوان';renderColors()}state.textContent='اكتملت القراءة. راجع البيانات؛ قد يخطئ OCR في بعض الأرقام والتواريخ.'}catch(e){state.textContent=e.message;toast(e.message)}}
async function saveCartons(){const data={company:selectedCompany,category:selectedCategory,color:document.getElementById('color').value,product_code:document.getElementById('product').value,sticker_code:document.getElementById('code').value,batch:document.getElementById('batch').value,production:document.getElementById('production').value,expiry:document.getElementById('expiry').value,weight:document.getElementById('weight').value,quantity:document.getElementById('quantity').value,sender:document.getElementById('sender').value,notes:document.getElementById('notes').value,image_path:imagePath};try{const d=await api('/api/cartons',{method:'POST',body:JSON.stringify(data)});toast(`تمت إضافة ${d.count} كرتونة إلى ${d.color}`);imagePath='';openPage('track')}catch(e){toast(e.message)}}
async function renderTrack(){const page=document.getElementById('page');page.innerHTML=title('متابعة الكراتين','سجل دخول المصنع وحدّث الوزن المتبقي لكل كرتونة.')+'<div class="card"><div id="activeList" class="empty">جارٍ التحميل...</div><button id="consumedToggle" class="section-toggle" onclick="toggleConsumed()">▾ الكراتين المستهلكة</button><div id="usedList" class="hidden"></div></div>';try{const rows=await api('/api/cartons');window.cartons=rows;drawCartons(false)}catch(e){toast(e.message)}}
function drawCartons(showUsed){const list=window.cartons||[],active=list.filter(x=>!x.consumed),used=list.filter(x=>x.consumed);document.getElementById('activeList').innerHTML=active.length?active.map(cartonCard).join(''):'<div class="empty">لا توجد كراتين قيد المتابعة.</div>';document.getElementById('usedList').innerHTML=used.map(cartonCard).join('')||'<div class="empty">لا توجد كراتين مستهلكة.</div>';document.getElementById('usedList').classList.toggle('hidden',!showUsed);document.getElementById('consumedToggle').textContent=(showUsed?'▴':'▾')+' الكراتين المستهلكة ('+used.length+')'}
function toggleConsumed(){drawCartons(document.getElementById('usedList').classList.contains('hidden'))}
function cartonCard(x){return `<article class="row-card"><div class="row-head"><div><div class="row-title">كرتونة ${x.id} · ${esc(x.category)} / ${esc(x.color)}</div><div class="meta">منتج ${esc(x.product_code||'—')} · Batch ${esc(x.batch||'—')}<br>إنتاج ${esc(x.production||'—')} · انتهاء ${esc(x.expiry||'—')}<br>الوزن الحالي ${x.remaining_weight} من ${x.initial_weight} كجم · آخر تعديل ${esc(x.updated_at)}</div></div><span class="pill ${x.factory?'factory':''} ${x.opened?'opened':''}">${x.consumed?'مستهلكة':x.factory?'داخل المصنع':x.opened?'مفتوحة':'في المخزن'}</span></div><div class="row-actions">${!x.factory&&!x.consumed?`<button class="btn small" onclick="cartonAction(${x.id},'factory')">تسجيل دخول المصنع</button>`:''}<button class="btn small" onclick="cartonAction(${x.id},'opened')">${x.opened?'إلغاء مفتوحة':'تحديد مفتوحة'}</button></div>${x.factory&&!x.consumed?`<div class="weight-edit"><label>الوزن بعد الاستهلاك</label><input type="number" min="0" max="${x.initial_weight}" step="0.1" id="weight-${x.id}" value="${x.remaining_weight}"><span>كجم</span><button class="btn small primary" onclick="cartonWeight(${x.id})">تحديث</button></div>`:''}</article>`}
async function cartonAction(id,action){try{await api(`/api/cartons/${id}/${action}`,{method:'POST',body:'{}'});renderTrack()}catch(e){toast(e.message)}}async function cartonWeight(id){try{await api(`/api/cartons/${id}/weight`,{method:'POST',body:JSON.stringify({weight:document.getElementById('weight-'+id).value})});renderTrack()}catch(e){toast(e.message)}}
async function renderStock(){const page=document.getElementById('page');page.innerHTML=title('الأرصدة الحالية','ملخص كل فئة لون مع العدد والتواريخ والأوزان.')+'<div class="card"><div id="stockRows" class="empty">جارٍ التحميل...</div></div>';try{const rows=(await api('/api/cartons')).filter(x=>!x.consumed);const groups={};rows.forEach(x=>(groups[x.category+'|'+x.color]??=[]).push(x));const values=Object.entries(groups);document.getElementById('stockRows').innerHTML=values.length?`<div class="table-wrap"><table class="table"><tr><th>الفئة / اللون</th><th>العدد</th><th>الإنتاج</th><th>الانتهاء</th><th>الوزن</th><th>مفتوحة</th></tr>${values.map(([k,a])=>`<tr><td>${esc(k.replace('|',' / '))}</td><td>${a.length}</td><td>${esc(a[0].production||'—')}</td><td>${esc(a[0].expiry||'—')}</td><td>${a.reduce((s,x)=>s+Number(x.remaining_weight),0).toFixed(1)} كجم</td><td>${a.filter(x=>x.opened).length}</td></tr>`).join('')}</table></div>`:'لا توجد أرصدة مسجلة.'}catch(e){toast(e.message)}}
async function renderUsers(){if(currentUser.role!=='manager')return;const page=document.getElementById('page');page.innerHTML=title('المستخدمون والصلاحيات','إدارة الحسابات متاحة لـ mrcarbon فقط.')+`<div class="card"><h2>إضافة مستخدم</h2><div class="grid"><div class="field"><label>اسم المستخدم</label><input id="newUsername"></div><div class="field"><label>كلمة مرور مؤقتة (10 أحرف على الأقل)</label><input id="newPassword" type="password"></div></div><div class="actions"><button class="btn primary" onclick="createUser()">إضافة الحساب</button></div></div><div class="card"><h2>الحسابات الحالية</h2><div id="userRows" class="empty">تحميل...</div></div>`;try{const rows=await api('/api/users');document.getElementById('userRows').innerHTML=rows.map(u=>`<article class="row-card"><div class="row-head"><div><b>${esc(u.username)}</b><div class="meta">${u.role==='manager'?'مدير المستخدمين':'مستخدم مخزون'} · ${u.active?'فعال':'معطل'}</div></div></div><div class="row-actions"><button class="btn small" onclick="changeUserPassword('${esc(u.username)}')">تغيير كلمة المرور</button>${u.username!==currentUser.username?`<button class="btn small" onclick="toggleUser('${esc(u.username)}')">${u.active?'تعطيل':'تفعيل'}</button>`:''}</div></article>`).join('')||'لا توجد حسابات.'}catch(e){toast(e.message)}}
async function createUser(){try{await api('/api/users',{method:'POST',body:JSON.stringify({username:document.getElementById('newUsername').value,password:document.getElementById('newPassword').value})});toast('تم إنشاء الحساب');renderUsers()}catch(e){toast(e.message)}}
async function changeUserPassword(username){const password=prompt('أدخل كلمة المرور الجديدة (10 أحرف على الأقل)');if(!password)return;try{await api(`/api/users/${encodeURIComponent(username)}/password`,{method:'POST',body:JSON.stringify({password})});toast('تم تغيير كلمة المرور')}catch(e){toast(e.message)}}
async function toggleUser(username){try{await api(`/api/users/${encodeURIComponent(username)}/active`,{method:'POST',body:'{}'});renderUsers()}catch(e){toast(e.message)}}
async function renderMoves(){const page=document.getElementById('page');page.innerHTML=title('سجل الحركات','سجل الإضافة ودخول المصنع وتحديث الوزن والاستهلاك.')+'<div class="card"><div id="movementRows" class="empty">جارٍ التحميل...</div></div>';try{const rows=await api('/api/movements');document.getElementById('movementRows').innerHTML=rows.length?`<div class="table-wrap"><table class="table"><tr><th>التاريخ</th><th>الكرتونة</th><th>الفئة/اللون</th><th>الحركة</th><th>الوزن</th><th>المستخدم</th></tr>${rows.map(x=>`<tr><td>${esc(x.at)}</td><td>${x.carton_id}</td><td>${esc(x.category)} / ${esc(x.color)}</td><td>${esc(x.action)}</td><td>${esc(x.weight)}</td><td>${esc(x.user)}</td></tr>`).join('')}</table></div>`:'لا توجد حركات.'}catch(e){toast(e.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});boot();
</script></body></html>
